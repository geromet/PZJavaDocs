name: Extractor tests

on:
  pull_request:
  push:
    branches:
      - feat/extractor-explicit-snapshot-identity

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Python version
        run: python3 --version

      - name: Install pinned extractor dependency
        run: python3 -m pip install --disable-pip-version-check javalang==0.13.0

      - name: Compile extractor and tests
        run: python3 -m py_compile extract_lua_api.py tests/test_extract_lua_api.py

      - name: Run portable extractor regression suite
        run: python3 -m unittest -v tests.test_extract_lua_api
